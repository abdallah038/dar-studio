name: dar-worker

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  fulfill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: fulfillment cycle
        run: node worker/worker.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAR_WALLET: ${{ secrets.DAR_WALLET }}
      - name: persist worker state
        run: |
          git config user.name "dar-worker"
          git config user.email "dar-worker@users.noreply.github.com"
          git add worker/worker_state.json
          git commit -m "dar: worker state [skip ci]" || echo "no changes"
          git pull --rebase origin main || true
          git push
